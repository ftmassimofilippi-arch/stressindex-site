name: controlli

# Gira SOLO sulle proposte (pull request), non a ogni push: tiene bassi i minuti consumati.
# Una proposta nuova sullo stesso ramo ferma il giro precedente.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: controlli-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    name: controlli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Segreti (gitleaks)
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Tipi
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prove
        run: echo "Nessuna prova automatica ancora nel sito Stress Index."
